name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Leimaa service workerin CACHE-versio commitin SHA:lla, jolloin jokainen
      # deploy tyhjentää selainten vanhan välimuistin automaattisesti eikä
      # sw.js:n versiovakiota tarvitse muistaa nostaa käsin. Käsin ylläpidetty
      # vakio jää tiedostoon pohjaksi/varalle (esim. hostaus ilman tätä
      # workflowta) — ks. MAINTENANCE.md.
      - name: Stamp service worker cache version with the commit SHA
        run: |
          sed -i "s/^const CACHE = \"[^\"]*\";/const CACHE = \"tuska-${GITHUB_SHA::8}\";/" sw.js
          # Varmista että leima todella päätyi tiedostoon: sed ei epäonnistu
          # vaikka mikään rivi ei osuisi (esim. jos vakion muotoilu muuttuu),
          # ja silloin deploy lähtisi hiljaa vanhalla cache-versiolla.
          grep "tuska-${GITHUB_SHA::8}" sw.js
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_WATER_0DF805303 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "." # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_WATER_0DF805303 }}
          action: "close"
